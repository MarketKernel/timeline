name: test

on:
  # A push to main is tested by pages.yml, which calls this workflow before it deploys.
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

# A newer push to the same branch makes the run for the older one moot.
# Called from pages.yml, github.workflow is the caller's: the two never share a group.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # build.mjs fails on anything the page would fetch from elsewhere (assertSelfContained).
      - run: npm run build

      # ubuntu-latest ships Chrome at /usr/bin/google-chrome, where tools/chrome.mjs looks.
      # The page and the PWA (build/pages/: the worker, the manifest, offline, updates).
      - run: npm run test:browser

      - uses: actions/upload-artifact@v4
        with:
          name: timeline
          path: build/timeline.html
